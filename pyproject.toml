[project]
name = "slsk-mcp"
version = "0.1.0"
description = "Soulseek MCP server — search and download music via Model Context Protocol"
requires-python = ">=3.11"
dependencies = [
    # 1.4.1's message reader dies on a frame it cannot deserialize: the `MessageDeserializationError`
    # handler logs the message it never bound, so it raises `UnboundLocalError` and the reader task ends.
    # Nothing reports that, and the client answers every search with nothing for the rest of its life.
    # 1.6.0 is the first release that binds the exception instead, and every symbol used here is present.
    "aioslsk==1.7.1",
    "mcp>=1.0.0,<2",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
slsk-mcp = "slsk_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/slsk_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
